name: workspace-smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workspace-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    name: APK workspace emulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Point Gradle at Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Test and assemble this exact revision
        run: ./gradlew :core:test :app:assembleDebug --no-daemon
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real APK without API keys or Accessibility
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: python3 tools/smoke_workspace.py app/build/outputs/apk/debug/app-debug.apk --reset-test-data
      - name: Preserve smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-smoke-evidence
          path: smoke-workspace-results/
          if-no-files-found: ignore
