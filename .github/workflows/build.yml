name: build

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The agent's logic needs no Android SDK, so it is checked on its own and
  # fails fast before anyone waits on an APK build.
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run core tests
        run: ./gradlew :core:test --no-daemon

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

  apk:
    name: Build APK
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # GitHub's Ubuntu runners ship the Android SDK and set ANDROID_HOME, which
      # is what settings.gradle.kts keys the :app module off. Written to
      # local.properties as well so the build does not depend on that env var
      # surviving into the Gradle daemon.
      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Name the APK with the commit it came from
        id: rename
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/aios-${GITHUB_SHA::7}.apk"
          echo "apk=dist/aios-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: aios-apk
          path: dist/*.apk
          if-no-files-found: error

      # Tagging a commit publishes an APK anyone can install over a cable with
      # tools/install.sh --download.
      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "AiOS ${GITHUB_REF_NAME}" \
            --notes "Debug-signed build of AiOS.

          Install onto a phone connected by USB:

              ./tools/install.sh --download

          The script installs the APK, grants its permissions and switches on the
          accessibility service that the agent uses to operate the phone." \
            --generate-notes \
            "${{ steps.rename.outputs.apk }}" \
          || gh release upload "${GITHUB_REF_NAME}" "${{ steps.rename.outputs.apk }}" --clobber
