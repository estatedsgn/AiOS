name: build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release under this tag (e.g. v0.1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # The agent's logic needs no Android SDK, so it is checked on its own and
  # fails fast before anyone waits on an APK build.
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run core tests
        run: ./gradlew :core:test --no-daemon

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

  apk:
    name: Build APK
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # GitHub's Ubuntu runners ship the Android SDK and set ANDROID_HOME, which
      # is what settings.gradle.kts keys the :app module off. Written to
      # local.properties as well so the build does not depend on that env var
      # surviving into the Gradle daemon.
      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Name the APK with the commit it came from
        id: rename
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/aios-${GITHUB_SHA::7}.apk"
          echo "apk=dist/aios-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: aios-apk
          path: dist/*.apk
          if-no-files-found: error

      # Publishes an APK anyone can install over a cable with
      # tools/install.sh --download. Triggered either by pushing a v* tag, or by
      # running this workflow manually with a release_tag - the manual path also
      # creates the tag, which is the only route available where a client cannot
      # push tags itself.
      - name: Publish the APK as a release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          APK: ${{ steps.rename.outputs.apk }}
        run: |
          notes=$(cat <<'EOF'
          Debug-signed build of AiOS.

          Install onto a phone connected over USB:

              ./tools/install.sh --download      # macOS / Linux
              .\tools\install.ps1 -Download      # Windows

          The script installs the APK, grants its runtime permissions, and switches
          on the accessibility service the agent uses to operate the phone. It says
          what it granted, keeps any accessibility service you already use, and
          `--uninstall` revokes only its own.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "AiOS $TAG" \
              --notes "$notes" \
              "$APK"
          fi
