name: build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional preview release tag (v*). Empty only builds and tests."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: aios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run core tests
        run: ./gradlew :core:test --no-daemon
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

  apk:
    name: Build APK
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build app, compile smoke tests, and lint
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon
      - name: Package APK with provenance and checksum
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ais-preview-${sha:0:7}.apk"
          printf 'AIS APK developer preview (NOT a ROM)\nBuilt commit: %s\nWorkflow run: %s\nDebug signing: not a production release identity\n' "$sha" "$GITHUB_RUN_ID" > dist/BUILD-INFO.txt
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          cp docs/APK-PREVIEW-TESTING.md dist/INSTALL-AND-TEST.md
      - uses: actions/upload-artifact@v4
        with:
          name: aios-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  smoke:
    name: Android smoke tests (API 35)
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise the stock-Android APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Publish device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  release:
    name: Publish requested preview release
    needs: [core, apk, smoke]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aios-apk
          path: dist
      - name: Publish debug preview, not a ROM
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo 'Expected a v-prefixed release tag'; exit 1; }
          (cd dist && sha256sum --check SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing release. Choose a new tag.'
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
            --title "AIS APK preview $TAG" --notes-file dist/INSTALL-AND-TEST.md dist/*
